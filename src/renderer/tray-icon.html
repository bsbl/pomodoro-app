<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c" width="128" height="128"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const SIZE = 128;
    const CENTER = SIZE / 2;
    const RING_RADIUS = 56;
    const RING_WIDTH = 12;
    const TOMATO_SIZE = 84; // leaves room for the ring around it

    const tomatoImg = new Image();
    let tomatoLoadPromise = new Promise((resolve) => {
      tomatoImg.onload = () => resolve();
    });
    tomatoImg.src = '../../assets/icons/tray.png';

    function drawTomato() {
      const offset = CENTER - TOMATO_SIZE / 2;
      ctx.drawImage(tomatoImg, offset, offset, TOMATO_SIZE, TOMATO_SIZE);
    }

    // fraction: remaining/total, in [0, 1]. 1 = full ring (session just started),
    // 0 = empty ring (session about to end). Returns a Promise so the caller
    // (tray-icon.js) can await the draw before capturing the page.
    async function renderIcon(fraction, accentColor, showRing) {
      await tomatoLoadPromise;
      ctx.clearRect(0, 0, SIZE, SIZE);

      if (showRing) {
        // Background ring (unfilled track).
        ctx.beginPath();
        ctx.arc(CENTER, CENTER, RING_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.18)';
        ctx.lineWidth = RING_WIDTH;
        ctx.stroke();

        // Progress arc, starting at 12 o'clock, counter-clockwise draw
        // direction so the ring depletes clockwise as fraction decreases
        // (depletes as time elapses).
        const clamped = Math.max(0, Math.min(1, fraction));
        if (clamped > 0) {
          const startAngle = -Math.PI / 2;
          const endAngle = startAngle - clamped * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(CENTER, CENTER, RING_RADIUS, startAngle, endAngle, true);
          ctx.strokeStyle = accentColor;
          ctx.lineWidth = RING_WIDTH;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
      }

      drawTomato();
    }

    window.renderIcon = renderIcon;
  </script>
</body>
</html>
