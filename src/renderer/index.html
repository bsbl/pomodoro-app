<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="header-row">
      <h1>🍅 Pomodoro</h1>
      <button class="icon-button" id="btn-open-settings" title="Settings">⚙</button>
    </div>

    <div class="time-display" id="time-display">25:00</div>
    <div class="state-label" id="state-label">Idle</div>

    <div class="task-row">
      <input type="text" id="task-input" list="task-history" placeholder="What are you working on?" />
      <datalist id="task-history"></datalist>
    </div>

    <div class="button-grid">
      <button id="btn-start">Start task</button>
      <button id="btn-stop">Stop task</button>
      <button id="btn-reset">Reset current</button>
      <button id="btn-pause-resume">Pause current</button>
    </div>

    <label class="autolaunch-row" id="autolaunch-row">
      <input type="checkbox" id="autolaunch-checkbox" />
      Start automatically on login
    </label>

    <div class="history-section">
      <h2>Task history</h2>
      <ul id="history-list"></ul>
    </div>
  </div>

  <!-- Alert overlay shown when a work session ends -->
  <div class="overlay hidden" id="alert-overlay">
    <div class="overlay-box">
      <p class="overlay-title">Time's up!</p>
      <p class="overlay-subtitle" id="overlay-subtitle">Task finished.</p>
      <p class="overlay-countdown" id="overlay-countdown"></p>
      <div class="overlay-buttons">
        <button id="btn-snooze">Snooze (+1 min)</button>
        <button id="btn-stop-alert">Stop (start break)</button>
      </div>
    </div>
  </div>

  <!-- Overlay shown after a manual "Stop task", proposing a break or a new task -->
  <div class="overlay hidden" id="post-stop-overlay">
    <div class="overlay-box">
      <p class="overlay-title">Task stopped</p>
      <p class="overlay-subtitle">Take a break, or start a new task?</p>
      <p class="overlay-countdown" id="post-stop-countdown"></p>
      <div class="overlay-buttons">
        <button id="btn-post-stop-break">Take a break</button>
        <button id="btn-post-stop-new-task">Start new task</button>
        <button id="btn-post-stop-close">Close</button>
      </div>
    </div>
  </div>

  <!-- Settings overlay: task/break durations + sessions before a long break -->
  <div class="overlay hidden" id="settings-overlay">
    <div class="overlay-box">
      <p class="overlay-title">Settings</p>
      <p class="overlay-subtitle">Changes apply to the next task or break — not the one currently running.</p>
      <div class="settings-form">
        <label>
          Task duration (minutes)
          <input type="number" id="setting-work-minutes" min="1" max="180" step="1" />
        </label>
        <label>
          Short break duration (minutes)
          <input type="number" id="setting-short-break-minutes" min="1" max="180" step="1" />
        </label>
        <label>
          Long break duration (minutes)
          <input type="number" id="setting-long-break-minutes" min="1" max="180" step="1" />
        </label>
        <label>
          Tasks before a long break
          <input type="number" id="setting-sessions-before-long-break" min="1" max="20" step="1" />
        </label>
        <label>
          Reset to short breaks after idle (minutes)
          <input type="number" id="setting-cycle-reset-minutes" min="1" max="1440" step="1" />
        </label>
      </div>
      <p class="settings-error hidden" id="settings-error"></p>
      <div class="overlay-buttons">
        <button id="btn-settings-save">Save</button>
        <button id="btn-settings-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="tauri-bridge.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
